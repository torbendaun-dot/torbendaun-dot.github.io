}

  --desk:#0b1117; --paper:#17212b; --paper2:#131c25; --ink:#e8eff5; --muted:#9aa8b5; --line:#2f3d4a;

<script>
(()=>{

const NS='http://www.w3.org/2000/svg';

function arrowAt(g,A,B,t=.5,s=9,cls='head'){const p={x:A.x+(B.x-A.x)*t,y:A.y+(B.y-A.y)*t};

const picker=sel=>t=>!!(t.closest&&t.closest(sel));

/* Spiegel als Kreisbogen. Optische Achse waagerecht, Licht kommt von links. */
function bench(kind,r,xs,y0){const sg=kind==='concave'?1:-1,M={x:xs+(kind==='concave'?-r:r),y:y0};

/* ===== Aufgaben (Quiz und Lückentext) ===== */
const QS=[
 {id:'refl',pg:'Seite 2',type:'c',text:'Das Lot steht {0} auf dem Spiegel. Der Einfallswinkel α und der Ausfallswinkel β sind {1}.',gaps:[{opts:['parallel','senkrecht','schräg'],ans:1},{opts:['gleich groß','verschieden groß'],ans:0}]},
 {id:'terms',pg:'Seite 3',type:'q',q:'Auf welche Seite des Hohlspiegels trifft das Licht?',opts:['Auf die Außenseite','Auf die Innenseite (Hohlseite)','Auf die Kante'],ans:1,why:'Der Hohlspiegel ist innen verspiegelt.'},
 {id:'lot',pg:'Seite 4',type:'c',text:'Das Lot geht beim Hohlspiegel immer durch den {0}.',gaps:[{opts:['Scheitel S','Mittelpunkt M','Rand des Spiegels'],ans:1}]},

/* ===== Beobachter-Simulation ===== */
const SIM={W:900,H:640,cx:450,ym:250,hw:80,R:320,dEye:300,g:80,half:300,sh:34};
SIM.ys=SIM.ym+SIM.g;SIM.ye=SIM.ym+SIM.dEye;
function mirrorAt(kind,s){const {cx,ym,hw,R}=SIM;
  if(kind==='plane')return{P:{x:cx+s*hw,y:ym},n:{x:0,y:-1}};
  const th=Math.asin(s*hw/R);
  if(kind==='concave'){const M={x:cx,y:ym+R},P={x:M.x+R*Math.sin(th),y:M.y-R*Math.cos(th)};return{P,n:unit(sub(P,M))}}
  const M={x:cx,y:ym-R},P={x:M.x+R*Math.sin(th),y:M.y+R*Math.cos(th)};return{P,n:unit(sub(P,M))}}
function imgPlane(kind){const g=SIM.g,f=SIM.R/2;if(kind==='plane')return{b:g,m:1};const b=kind==='concave'?f*g/(f-g):f*g/(g+f);return{b,m:b/g}}
function trace(kind,xe,s){const {P,n}=mirrorAt(kind,s),E={x:xe,y:SIM.ye},d=unit(sub(P,E)),dr=reflect(d,n);let hit=null,u=0,valid=false;
  if(dr.y>1e-3){const t=(SIM.ys-P.y)/dr.y;hit={x:P.x+dr.x*t,y:SIM.ys};u=hit.x-SIM.cx;valid=Math.abs(u)<=SIM.half}
  const ip=imgPlane(kind),yi=SIM.ym-ip.b,ti=(yi-P.y)/d.y;
  return{P,n,E,d,dr,hit,u,valid,xi:P.x+d.x*ti,yi}}
function analyze(kind,xe){let lo=1e9,hi=-1e9,bad=0;const K=40;
  for(let k=0;k<=K;k++){const t=trace(kind,xe,-1+2*k/K);if(t.valid){lo=Math.min(lo,t.u);hi=Math.max(hi,t.u)}else bad++}
  const ip=imgPlane(kind);return{lo,hi,vis:Math.max(0,(hi-lo)/SC),bad,b:ip.b/SC,m:ip.m}}
const WORD='ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function figObserver(host,ctx,o){

  txt(stat,cx-half-12,ys+sh/2+5,'Gegenstand','lbl-obj','end');txt(stat,cx+half+12,ys+sh+28,'cm','lbl-s','start');
  el('circle',{r:36,fill:'transparent'},eye);el('path',{d:'M-26 0Q0 -19 26 0Q0 19 -26 0Z',class:'eye-w'},eye);el('circle',{r:8,cy:-2,class:'eye-p'},eye);
  txt(eye,0,42,'Beobachter','lbl');txt(eye,-52,5,'◀','lbl-s','end');txt(eye,52,5,'▶','lbl-s','start');

    for(let i=-10;i<=10;i++){const {P,n}=mirrorAt(kind,i/10),b=kind==='convex'?{x:-n.x,y:-n.y}:n,t={x:-b.y,y:b.x};seg(mg,P,add(add(P,b,14),t,9),'hatch')}
    txt(mg,cx+hw+16,ym-6,{plane:'Planspiegel',concave:'Hohlspiegel',convex:'Wölbspiegel'}[kind],'lbl','start')}
  const ro=html('<div class="readout" aria-live="polite"></div>');
  const ctrl=html(`<div class="ctrls"><label class="sl" for="xs">Beobachter verschieben <input id="xs" type="range" min="-320" max="320" step="1" value="${xe-cx}"></label></div>`);
  const opt=html('<div class="ctrls"><label class="sl"><input type="checkbox" id="cE" checked> gestrichelte Verlängerung</label><label class="sl"><input type="checkbox" id="cI" checked> Spiegelbild zeigen</label></div>');
  let sw=null;
  if(o.switchable){sw=html('<div class="chips" role="group" aria-label="Spiegelart"></div>');

  function render(){dyn.innerHTML='';eye.setAttribute('transform',`translate(${xe} ${ye})`);eye.setAttribute('aria-valuenow',Math.round(xe-cx));

      txt(dyn,cx,yi-hhI-10,'Spiegelbild','lbl-img');

        ro.innerHTML=`<span>Der Beobachter sieht <b>${fmt(an.vis)} cm</b> von ${2*half/SC} cm des Schriftzugs${an.hi>=an.lo?` (von ${fmt((an.lo+half)/SC)} cm bis ${fmt((an.hi+half)/SC)} cm)`:''}</span>`+

function figAnswers(host,ctx){
  const n=QS.length,okN=QS.filter(q=>ans[q.id]&&ans[q.id].ok).length,did=QS.filter(q=>ans[q.id]).length;
  const wrap=html(`<div><h2 style="font-size:1.2rem;margin:.2em 0">Deine Antworten</h2><p><b>${okN} von ${n}</b> Aufgaben richtig. ${did<n?`${n-did} noch nicht bearbeitet (die Zusatzseiten sind freiwillig).`:'Alle Aufgaben bearbeitet. Super!'}</p><div class="scroll"><table class="tbl ans"><thead><tr><th>Aufgabe</th><th>Deine Antwort</th><th></th></tr></thead><tbody></tbody></table></div><p><button class="btn chip" id="clr" type="button">Antworten löschen</button></p></div>`);
  const tb=$('tbody',wrap);
  QS.forEach(q=>{const a=ans[q.id],qt=q.type==='q'?q.q:q.text.replace(/\{\d+\}/g,'…');
    tb.appendChild(html(`<tr><td><span class="pg">${q.pg}</span>${qt}</td><td>${a?a.a:'<span class="hint">noch nicht beantwortet</span>'}</td><td class="${a?(a.ok?'ok':'no'):''}">${a?(a.ok?'✓':'✗'):''}</td></tr>`))});
  host.appendChild(wrap);
  $('#clr',wrap).onclick=()=>{ans={};try{localStorage.removeItem('spiegel-ans')}catch(e){}render()};
  ctx.done()}

/* ===== Seiten ===== */
const PAGES=[];const page=o=>PAGES.push(o);
const K1='Kapitel 1 · Das Lot am Hohlspiegel',K2='Kapitel 2 · Der Brennpunkt',K3='Kapitel 3 · Das Spiegelbild',K4='Zum Schluss',KZ='Zusatz für Schnelle · Bilder zeichnen';

page({id:'cover',ch:'',title:'Hohl- und Wölbspiegel',
html:`<p class="lead">Im Löffel stehst du auf dem Kopf. An der Kreuzung hängt ein runder Spiegel. Warum ist das so?</p>
<p>Du kennst das Reflexionsgesetz vom ebenen Spiegel. Jetzt untersuchst du runde Spiegel:</p>
<ol class="steps"><li>Du zeichnest das <b>Lot</b> am Hohlspiegel.</li><li>Damit findest du den <b>Brennpunkt</b>.</li><li>Du vergleichst, was ein Beobachter in verschiedenen Spiegeln sieht.</li><li>Zusatz für Schnelle: Du zeichnest Bilder.</li></ol>
<p class="hint">Blättere mit den Knöpfen unten, mit den Pfeiltasten oder durch Wischen auf dieser Seite. Die Zeichnungen rechts kannst du anfassen und verändern.</p>
<p><button class="btn pri" type="button" data-go="1">Los geht’s ›</button></p>`,
init:c=>figCover(c.fig)});

page({id:'refl',ch:K1,title:'Das Reflexionsgesetz',
html:`<p>Ein Lichtstrahl trifft auf einen Spiegel und springt weg. Das nennt man <b>Reflexion</b>. Dabei hilft dir das <b>Lot</b>. Es steht <b>senkrecht</b> (90°) auf dem Spiegel.</p>
<div class="merke"><b>Reflexionsgesetz</b><br>Der Einfallswinkel α und der Ausfallswinkel β sind gleich groß: <b>α = β</b>. Du misst beide vom Lot aus.</div>
<div class="task"><b>Aufgabe:</b> Ziehe die Lichtquelle am Kreis. Was passiert mit β, wenn du α änderst?</div>
<p class="status" id="st" aria-live="polite"></p>
<div id="qz"></div>
<p>Beim ebenen Spiegel zeigt das Lot überall in dieselbe Richtung. Wie ist das bei einem runden Spiegel? Das findest du auf den nächsten Seiten heraus.</p>`,
init:c=>{figPlane(c.fig,c);cloze(c.q('#qz'),'refl',c)}});

page({id:'terms',ch:K1,title:'Der Hohlspiegel',
html:`<p>Ein <b>Hohlspiegel</b> ist ein Stück von einer Kugel. Er ist innen verspiegelt. In der Zeichnung siehst du ihn von der Seite.</p>
<div class="task"><b>Aufgabe:</b> Tippe nacheinander auf alle fünf Begriffe. Sie leuchten dann in der Zeichnung auf.</div>
<div class="chips" id="chips"></div><div class="defbox" id="def">Wähle einen Begriff.</div>
<div id="qz"></div>`,
init:c=>{figTerms(c.fig,c);quiz(c.q('#qz'),'terms',c)}});

page({id:'lot',ch:K1,title:'Das Lot am Hohlspiegel',
html:`<p>Der Hohlspiegel ist rund. An einer ganz kleinen Stelle sieht er aber fast gerade aus (gestrichelte Linie). Dort kannst du das Lot einzeichnen.</p>
<div class="merke"><b>Das Lot</b> steht senkrecht (90°) auf dem Spiegel. Beim runden Spiegel gilt das an der kleinen geraden Stelle im Punkt P.</div>
<div class="task"><b>Aufgabe:</b> Drehe am roten Griff, bis das Lot genau 90° zur gestrichelten Linie hat. Mache das für beide Punkte.</div>
<p class="status" id="st" aria-live="polite"></p>
<div class="merke" id="rev" hidden><b>Entdeckung:</b> Beide Lote treffen sich in einem Punkt: dem Mittelpunkt <b>M</b>. Das Lot geht beim Hohlspiegel also immer durch M.</div>
<div id="qz" hidden></div>`,
init:c=>{figLot(c.fig,c);cloze(c.q('#qz'),'lot',c)}});

page({id:'par',ch:K2,title:'Parallele Strahlen',
html:`<p>Parallele Strahlen kommen von links, so wie Sonnenlicht. Wohin werden sie am Hohlspiegel reflektiert? Mit dem Lot findest du es heraus:</p>
<ol class="steps"><li><b>Lot zeichnen:</b> Tippe auf M. Das Lot geht durch P und M.</li><li><b>Strahl drehen:</b> Drehe den reflektierten Strahl am Griff, bis β so groß ist wie α.</li><li><b>Beobachten:</b> Wo trifft der Strahl die optische Achse?</li></ol>
<p>Mache das für beide Strahlen.</p>
<div class="btnrow"><button class="btn" id="bLot" type="button">Lot einzeichnen</button></div>
<p class="status" id="st" aria-live="polite"></p>
<div id="rev" hidden><div class="merke"><b>Entdeckung:</b> Beide Strahlen laufen (fast) durch denselben Punkt. Das ist der <b>Brennpunkt F</b>. Er liegt ungefähr in der Mitte zwischen S und M.</div>
<details class="more"><summary>Warum „fast“?</summary><p>Je weiter ein Strahl von der Achse entfernt ist, desto weiter vorn trifft er die Achse. Das liegt an der Rundung des Spiegels. Für uns gilt: Die Strahlen treffen sich ungefähr in F.</p></details>
<div id="qz"></div></div>`,
init:c=>{figParallel(c.fig,c);cloze(c.q('#qz'),'par',c)}});

page({id:'focal',ch:K2,title:'Brennpunkt und Brennweite',
html:`<div class="merke"><b>Brennpunkt F</b><br>Parallele Strahlen laufen nach der Reflexion durch F. Der Abstand von S bis F heißt <b>Brennweite f</b>.</div>
<div class="task"><b>Experiment:</b> Stelle mit dem Regler verschiedene Radien r ein. Lies am Lineal ab, wo F liegt. Drücke jedes Mal auf „Notieren“. Notiere mindestens drei Werte.</div>
<div id="obs" hidden><div class="merke"><b>Beobachtung:</b> Die Brennweite f ist immer halb so groß wie der Radius r. F liegt genau in der Mitte zwischen S und M.</div></div>
<div id="qz"></div><div id="qz2"></div>`,
init:c=>{figFocal(c.fig,c);quiz(c.q('#qz'),'foc1',c);cloze(c.q('#qz2'),'foc2',c)}});

page({id:'obs1',ch:K3,title:'Was sieht der Beobachter im Planspiegel?',
html:`<p>Du schaust jetzt von oben auf einen Spiegel. Unten steht ein Beobachter. Vor dem Spiegel steht ein <b>Schriftzug</b> (der Gegenstand).</p>
<p>Vom Auge gehen zwei <b>Randstrahlen</b> zum Spiegel. Sie werden reflektiert und treffen den Schriftzug. Den Teil dazwischen sieht der Beobachter im Spiegel. Der Rest ist abgedunkelt.</p>
<p>Hinter dem Spiegel zeigen die gestrichelten Linien, wo das <b>Spiegelbild</b> liegt.</p>
<div class="task"><b>Aufgabe:</b> Ziehe den Beobachter nach links und rechts. Was verändert sich? Wo liegt das Spiegelbild?</div>
<div id="qz"></div>
<details class="more"><summary>Lösung anzeigen</summary><p>Der sichtbare Teil wandert, seine Größe bleibt gleich. Das Spiegelbild liegt genauso weit hinter dem Spiegel, wie der Schriftzug davor steht. Es ist genauso groß wie der Schriftzug.</p></details>
`,
init:c=>{figObserver(c.fig,c,{kind:'plane',switchable:false});quiz(c.q('#qz'),'o1',c)}});

page({id:'obs2',ch:K3,title:'Was sieht der Beobachter im Hohlspiegel?',
html:`<p>Jetzt ist der Spiegel ein <b>Hohlspiegel</b>. Der Schriftzug steht nah vor dem Spiegel.</p>
<div class="task"><b>Aufgabe:</b> Ziehe den Beobachter hin und her. Wechsle zwischendurch zum Planspiegel und wieder zurück. Vergleiche: Wie viel vom Schriftzug siehst du? Ist das Spiegelbild größer oder kleiner?</div>
<div id="qz"></div>
<details class="more"><summary>Lösung anzeigen</summary><p>Im Hohlspiegel siehst du weniger vom Schriftzug. Das Spiegelbild ist größer (etwa doppelt so groß) und liegt weit hinter dem Spiegel.</p></details>
`,
init:c=>{figObserver(c.fig,c,{kind:'concave',switchable:true});cloze(c.q('#qz'),'o2',c)}});

page({id:'obs3',ch:K3,title:'Was sieht der Beobachter im Wölbspiegel?',
html:`<p>Beim <b>Wölbspiegel</b> wölbt sich der Spiegel zum Beobachter hin. Die Randstrahlen laufen nach der Reflexion auseinander. Der Schriftzug ist hier breiter, damit du den ganzen sichtbaren Teil siehst.</p>
<div class="task"><b>Aufgabe:</b> Ziehe den Beobachter hin und her und vergleiche mit den anderen Spiegeln. Wie viel vom Schriftzug siehst du? Ist das Spiegelbild größer oder kleiner?</div>
<div id="qz"></div>
<details class="more"><summary>Lösung anzeigen</summary><p>Im Wölbspiegel siehst du am meisten vom Schriftzug. Das Spiegelbild ist kleiner (etwa zwei Drittel) und liegt nah hinter dem Spiegel.</p></details>
<p class="hint">Darum hängen an unübersichtlichen Kreuzungen Wölbspiegel.</p>
`,
init:c=>{figObserver(c.fig,c,{kind:'convex',switchable:true});cloze(c.q('#qz'),'o3',c)}});

page({id:'cmp',ch:K3,title:'Die drei Spiegel im Vergleich',
html:`<p>Hier stehen die Werte aller drei Spiegel nebeneinander. Die Spalte des gewählten Spiegels ist hervorgehoben.</p>
<div class="task"><b>Aufgabe:</b> Wechsle zwischen den Spiegeln, verschiebe den Beobachter und beantworte die Fragen.</div>
<div id="qz"></div><div id="qz2"></div><div id="qz3"></div>`,
init:c=>{const tbl=html(`<div class="scroll"><table class="tbl"><thead><tr><th></th><th data-k="plane">Planspiegel</th><th data-k="concave">Hohlspiegel</th><th data-k="convex">Wölbspiegel</th></tr></thead><tbody>
<tr><th>Sichtbarer Teil</th><td data-k="plane" data-r="vis"></td><td data-k="concave" data-r="vis"></td><td data-k="convex" data-r="vis"></td></tr>
<tr><th>Lage des Spiegelbilds</th><td data-k="plane" data-r="b"></td><td data-k="concave" data-r="b"></td><td data-k="convex" data-r="b"></td></tr>
<tr><th>Größe des Spiegelbilds</th><td data-k="plane" data-r="m"></td><td data-k="concave" data-r="m"></td><td data-k="convex" data-r="m"></td></tr>
<tr><th>Beispiel</th><td data-k="plane">Badspiegel</td><td data-k="concave">Rasierspiegel</td><td data-k="convex">Verkehrsspiegel</td></tr></tbody></table></div>`);
  let sel='plane';const hl=()=>tbl.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('hl',x.dataset.k===sel));
  const upd=off=>{const xe=SIM.cx+off;['plane','concave','convex'].forEach(k=>{const a=analyze(k,xe);
    tbl.querySelector(`td[data-k=${k}][data-r=vis]`).textContent=fmt(a.vis)+' cm von '+(2*SIM.half/SC)+' cm';
    tbl.querySelector(`td[data-k=${k}][data-r=b]`).textContent=fmt(a.b)+' cm hinter dem Spiegel';
    tbl.querySelector(`td[data-k=${k}][data-r=m]`).textContent=Math.abs(a.m-1)<.02?'so groß wie der Gegenstand':(a.m>1?'vergrößert ×':'verkleinert ×')+fmt(a.m)});hl()};
  figObserver(c.fig,c,{kind:'plane',switchable:true,onUpdate:upd});
  c.fig.appendChild(tbl);
  c.fig.querySelectorAll('.chips [data-k]').forEach(b=>b.addEventListener('click',()=>{sel=b.dataset.k;hl()}));hl();
  quiz(c.q('#qz'),'c1',c);quiz(c.q('#qz2'),'c2',c);quiz(c.q('#qz3'),'c3',c)}});

page({id:'sum',ch:K4,title:'Das Wichtigste und deine Antworten',
html:`<div class="merke"><b>Merke</b><ul style="margin:.4em 0 0;padding-left:1.2em"><li>Das <b>Lot</b> steht senkrecht auf dem Spiegel. Beim Hohlspiegel geht es durch den Mittelpunkt M.</li><li>Parallele Strahlen laufen nach der Reflexion durch den <b>Brennpunkt F</b>.</li><li>Die Brennweite f ist halb so groß wie der Radius r.</li><li>Steht der Gegenstand nah am Hohlspiegel, ist das Spiegelbild <b>größer</b>. Man sieht aber nur <b>wenig</b>.</li><li>Im Wölbspiegel ist das Spiegelbild <b>kleiner</b>. Man sieht aber <b>viel</b>.</li></ul></div>
<p>Rechts siehst du alle deine Antworten. Mit den Punkten unten kannst du zu einer Seite zurückspringen und Fehler verbessern.</p>
<p>Auf den nächsten Seiten warten Zusatzaufgaben für Schnelle: Du zeichnest Bilder an Hohl- und Wölbspiegel. Das ist schwerer.</p>
<p><button class="btn" type="button" data-go="0">‹ Zurück zum Anfang</button></p>`,
init:c=>figAnswers(c.fig,c)});

page({id:'rules',ch:KZ,title:'Drei Strahlen, die du kennen musst',
html:`<p><b>Zusatz für Schnelle.</b> Um Bilder zu zeichnen, brauchst du drei Strahlen, deren Weg du genau kennst.</p>
<div class="task"><b>Aufgabe:</b> Wähle einen Strahl. Ziehe den Gegenstand (orange) an andere Stellen. Sieh dir alle drei Strahlen an.</div>
<div class="chips" id="tabs"></div><div class="defbox" id="rule"></div>
<div id="qz"></div>`,
init:c=>{figRules(c.fig,c);quiz(c.q('#qz'),'z1',c)}});

page({id:'img1',ch:KZ,title:'Das Bild im Hohlspiegel',
html:`<p>Ein Gegenstand (Pfeil) steht vor dem Hohlspiegel. Das <b>Bild</b> entsteht dort, wo sich die reflektierten Strahlen treffen. Liegt der Treffpunkt vor dem Spiegel, kannst du das Bild auf einem Schirm auffangen. Man sagt: Das Bild ist <b>reell</b>.</p>
<div class="task"><b>Aufgabe:</b> Blende ① den Parallelstrahl und ② den Brennpunktstrahl ein. Zeige dann ③ das Bild. Verschiebe den Gegenstand.</div>
<p class="hint">Tipp: Bei g = 14 cm steht der Gegenstand im Mittelpunkt M.</p>
<div id="qz"></div>`,
init:c=>{figImage(c.fig,c,{kind:'concave',g0:20});quiz(c.q('#qz'),'z2',c)}});

page({id:'img2',ch:KZ,title:'Der Gegenstand steht nah am Spiegel',
html:`<p>Steht der Gegenstand näher am Spiegel als der Brennpunkt (g ist kleiner als f), laufen die reflektierten Strahlen auseinander.</p>
<p>Verlängerst du sie nach hinten (gestrichelt), treffen sie sich <b>hinter dem Spiegel</b>. Dort sieht dein Auge das Bild. Es ist nur im Spiegel zu sehen: Das Bild ist <b>virtuell</b>. Das kennst du vom Rasierspiegel.</p>
<div class="task"><b>Aufgabe:</b> Zeige alle Strahlen und das Bild. Verschiebe den Gegenstand bis kurz vor F (g = 6 cm). Was passiert mit dem Bild?</div>
<div id="qz"></div>`,
init:c=>{figImage(c.fig,c,{kind:'concave',g0:4});quiz(c.q('#qz'),'z3',c)}});

page({id:'img3',ch:KZ,title:'Das Bild im Wölbspiegel',
html:`<p>Der Wölbspiegel wölbt sich zu dir hin. Mittelpunkt M und Brennpunkt F liegen <b>hinter</b> dem Spiegel. Das Lot zeigt von M weg.</p>
<p>Die reflektierten Strahlen laufen auseinander. Sie sehen so aus, als kämen sie von F.</p>
<div class="task"><b>Aufgabe:</b> Zeichne das Bild mit dem Parallelstrahl und dem Brennpunktstrahl. Verschiebe den Gegenstand. Wird das Bild irgendwo reell?</div>
<div id="qz"></div>`,
init:c=>{figImage(c.fig,c,{kind:'convex',g0:10});quiz(c.q('#qz'),'z4',c)}});

['cover','lot','par','sum'].forEach(id=>{PAGES.find(p=>p.id===id).act=false});
/* ===== Blättern ===== */
const book=$('#book'),pl=$('#pl'),pr=$('#pr');let cur=0;
try{const s=+localStorage.getItem('spiegel-page');if(s>=0&&s<PAGES.length&&PAGES.slice(0,s).every(p=>doneMap[p.id]))cur=s}catch(e){}
function render(dir){const p=PAGES[cur];
  $('#run').textContent=(p.ch?p.ch+' · ':'')+'Seite '+(cur+1)+' von '+PAGES.length;
  book.classList.remove('flip-next','flip-prev');void book.offsetWidth;if(dir)book.classList.add(dir>0?'flip-next':'flip-prev');
  pl.innerHTML=`<div class="kap">${p.ch||'Lernbuch Optik'}</div><h1>${p.title}</h1>${p.html}<p class="hint lockmsg" id="lockmsg" aria-live="polite"></p><div class="pno">${cur+1}</div>`;
  pr.innerHTML='';const fig=html('<div class="fig"></div>');pr.appendChild(fig);
  const ctx={fig,left:pl,q:s=>$(s,pl),need:new Set(p.act===false?[]:['act']),got:new Set(),page:p};
  ctx.done=(k='act')=>{ctx.got.add(k);if([...ctx.need].every(x=>ctx.got.has(x)))markDone(p.id);renderDots()};
  try{p.init&&p.init(ctx)}catch(err){console.error(err);fig.textContent='Diese Seite konnte nicht aufgebaut werden: '+err.message}
  if(!ctx.need.size)markDone(p.id);
  renderDots();
  try{localStorage.setItem('spiegel-page',cur)}catch(e){}}
const unlocked=i=>PAGES.slice(0,i).every(p=>doneMap[p.id]);
function go(i){if(i<0||i>=PAGES.length||i===cur)return;if(i>cur&&!unlocked(i)){const m=$('#lockmsg');if(m)m.textContent='Bearbeite zuerst die Aufgaben auf dieser Seite. Dann kannst du weiterblättern.';return}const dir=i>cur?1:-1;cur=i;render(dir);window.scrollTo(0,0)}
function renderDots(){const d=$('#dots');d.innerHTML='';const blocked=!doneMap[PAGES[cur].id];$('#prev').disabled=cur===0;$('#next').disabled=cur===PAGES.length-1||blocked;const lm=$('#lockmsg');if(lm)lm.textContent=(blocked&&cur<PAGES.length-1)?'Bearbeite zuerst die Aufgaben auf dieser Seite. Dann kannst du weiterblättern.':'';PAGES.forEach((p,i)=>{const b=html(`<button class="dot" type="button" aria-label="Seite ${i+1}: ${p.title}"></button>`);
  if(doneMap[p.id])b.classList.add('done');if(i===cur)b.classList.add('cur');if(i>cur&&!unlocked(i))b.classList.add('lock');b.onclick=()=>go(i);d.appendChild(b)})}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
pl.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select,[data-keys]'))return;if(!$('#toc').hidden){if(e.key==='Escape')$('#toc').hidden=true;return}
  if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});
let sx=null,sy=null,st0=0,sid=null;
pl.addEventListener('pointerdown',e=>{sx=null;if(e.pointerType==='mouse'||e.target.closest('button,input,select,option,summary,a,label'))return;sx=e.clientX;sy=e.clientY;st0=Date.now();sid=e.pointerId});
pl.addEventListener('pointercancel',()=>{sx=null});
pl.addEventListener('pointerup',e=>{if(sx===null||e.pointerId!==sid)return;const dx=e.clientX-sx,dy=e.clientY-sy,fast=Date.now()-st0<700;sx=null;
  if(e.target.closest('button,input,select,option,summary,a,label'))return;
  if(fast&&Math.abs(dx)>90&&Math.abs(dy)<40&&Math.abs(dx)>2.5*Math.abs(dy))go(cur+(dx<0?1:-1))});
function openToc(){const l=$('#tocList');l.innerHTML='';let last=null;
  PAGES.forEach((p,i)=>{const ch=p.ch||'Titelseite';if(ch!==last){l.appendChild(html(`<h3>${ch}</h3>`));last=ch}
    const b=html(`<button class="entry" type="button"><span class="n">${i+1}</span><span>${p.title}</span>${doneMap[p.id]?'<span class="ck" aria-label="erledigt">✓</span>':''}</button>`);
    b.onclick=()=>{$('#toc').hidden=true;go(i)};l.appendChild(b)});
  $('#toc').hidden=false;$('#tocClose').focus()}
$('#tocBtn').onclick=openToc;$('#tocClose').onclick=()=>{$('#toc').hidden=true};$('#toc').addEventListener('click',e=>{if(e.target.id==='toc')$('#toc').hidden=true});
render(0);
})();
</script>

</body></html>
